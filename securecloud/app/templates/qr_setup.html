{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5 reveal-anim">
        <div class="premium-card text-center">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-light mb-4 shadow-sm" style="width: 56px; height: 56px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#2563eb" class="bi bi-qr-code" viewBox="0 0 16 16">
                  <path d="M2 2h2v2H2z"/>
                  <path d="M6 0v6H0V0zM5 1H1v4h4zM4 12H2v2h2z"/>
                  <path d="M6 10v6H0v-6zm-5 1v4h4v-4zm11-9h2v2h-2z"/>
                  <path d="M10 0v6h6V0zm5 1v4h-4V1zM8 1V0h1v2H8v2H7V1zm0 5V4h1v2zM6 8V7h1V6h1v2h1V7h5v1h-4v1H7V8zm0 0v1H2V8H1v1H0V7h3v1zm10 1h-1V7h1zm-1 0h-1v2h2v-1h-1zm-4 0h2v1h-1v1h-1zm2 3v-1h-1v1h-1v1H9v1h3v-2zm0 0h3v1h-2v1h-1zm-4-1v1h1v-2H7v1z"/>
                  <path d="M7 12h1v3h4v1H7zm9 2v2h-3v-1h2v-1z"/>
                </svg>
            </div>
            
            <h3 class="mb-2 text-gradient">Set up Authenticator</h3>
            <p class="text-secondary small mb-4">Scan the QR code below with your favorite Authenticator app (e.g. Google Authenticator).</p>
            
            <div class="bg-white p-2 rounded d-inline-block shadow-sm border mb-4">
                <img src="data:image/png;base64,{{ qr_b64 }}" alt="QR Code" style="max-width: 180px;">
            </div>
            
            <div class="bg-light rounded p-2 mb-4 d-inline-block border text-secondary small">
                Manual code: <code class="fw-bold text-dark">{{ secret }}</code>
            </div>
            
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <div class="mb-4 text-start">
                    <label class="form-label">Verification Code</label>
                    <input type="text" class="form-control text-center tracking-widest fs-5" name="totp_code" placeholder="000 000" autocomplete="off" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Confirm & Complete</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
